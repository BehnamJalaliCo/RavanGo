name: Regenerate Xcode Project

on:
  push:
    branches: [main]
    paths:
      - project.yml
      - .github/workflows/regenerate-project.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Validate generated project
        run: xcodebuild -list -project RavanGo.xcodeproj

      - name: Commit generated Xcode project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RavanGo.xcodeproj
          if git diff --cached --quiet; then
            echo "Generated project is already current."
            exit 0
          fi
          git commit -m "build: regenerate valid Xcode project"
          git push origin main
