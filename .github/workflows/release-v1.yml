name: Release v1.0.0

on:
  workflow_run:
    workflows: ["Screenshots"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create v1.0.0 pre-release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 release already exists."
            exit 0
          fi

          gh release create v1.0.0             --target "$(git rev-parse HEAD)"             --title "RavanGo v1.0.0"             --prerelease             --notes "First public source release of RavanGo.

          This release is marked as a pre-release until final physical-iPhone validation is complete.

          Highlights:
          - Native SwiftUI iPhone teleprompter
          - CADisplayLink + UIScrollView smooth scrolling
          - English and Persian localization with RTL support
          - Local SwiftData storage
          - JSON import/export
          - No backend, account, analytics, ads, or tracking
          - Apache-2.0 source license

          IRANYekanX is optional proprietary software and is not redistributed in this public repository. Licensed users can install it locally with scripts/install-iranyekanx.sh."
