name: Diagnose Xcode Project

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test current project
        continue-on-error: true
        run: |
          echo "=== CURRENT PROJECT ==="
          xcodebuild -list -project RavanGo.xcodeproj

      - name: Test initial project file
        run: |
          echo "=== INITIAL PROJECT FILE ==="
          cp RavanGo.xcodeproj/project.pbxproj /tmp/current.pbxproj
          git show 3f3380688069b9dc049a49d1e78fb96246e3ec4f:RavanGo.xcodeproj/project.pbxproj > RavanGo.xcodeproj/project.pbxproj
          xcodebuild -list -project RavanGo.xcodeproj
          cp /tmp/current.pbxproj RavanGo.xcodeproj/project.pbxproj
