<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">RavanGo teleprompter flow</title>
  <desc id="desc">An animated script moves upward through a focused reading zone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="screenClip"><rect x="70" y="28" width="220" height="244" rx="28"/></clipPath>
  </defs>
  <rect width="960" height="300" rx="28" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="70" y="28" width="220" height="244" rx="28" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="3"/>
    <rect x="82" y="42" width="196" height="216" rx="18" fill="#000"/>
    <g clip-path="url(#screenClip)" fill="#fff" font-family="Arial, sans-serif" font-size="18">
      <g>
        <text x="104" y="116">Welcome to RavanGo</text>
        <text x="104" y="151">Read clearly.</text>
        <text x="104" y="186">Move smoothly.</text>
        <text x="104" y="221">Stay focused.</text>
        <animateTransform attributeName="transform" type="translate" from="0 78" to="0 -100" dur="5s" repeatCount="indefinite"/>
      </g>
    </g>
    <rect x="88" y="150" width="184" height="2" rx="1" fill="#30d158" opacity=".8">
      <animate attributeName="opacity" values=".35;.95;.35" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif">
    <text x="370" y="100" font-size="28" font-weight="700">Simple script flow</text>
    <text x="370" y="142" font-size="18" fill="#d1d1d6">Create</text>
    <text x="520" y="142" font-size="18" fill="#d1d1d6">Configure</text>
    <text x="690" y="142" font-size="18" fill="#d1d1d6">Read</text>
    <path d="M440 136h54M590 136h54" stroke="#30d158" stroke-width="3" stroke-linecap="round"/>
    <path d="m487 128 10 8-10 8M637 128l10 8-10 8" fill="none" stroke="#30d158" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="370" y="205" font-size="16" fill="#98989d">Offline · bilingual · RTL-ready · smooth scrolling</text>
  </g>
</svg>
